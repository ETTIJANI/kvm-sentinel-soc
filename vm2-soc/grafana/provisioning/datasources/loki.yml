# Grafana datasource provisioning — Loki, uid pinned to "loki".
#
# The uid is referenced by ssh-soc-dashboard.json; changing it here means
# changing it there too.
apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 2000
      timeout: 60
      derivedFields: []
